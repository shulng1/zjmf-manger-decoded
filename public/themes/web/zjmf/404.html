<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8" />
    <title>404 - 页面未找到</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
        }

        .error-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .error-content h1 {
            font-size: 150px;
            font-weight: 300;
            color: #6c757d;
            margin: 0;
            line-height: 1;
        }

        .error-content h3 {
            font-size: 24px;
            color: #495057;
            margin: 20px 0;
        }

        .error-content p {
            color: #6c757d;
            margin-bottom: 30px;
        }

        .error-content a {
            display: inline-block;
            padding: 10px 30px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .error-content a:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="error-page">
        <div class="error-content">
            <h1>404</h1>
            <h3>页面未找到</h3>
            <p>抱歉，您访问的页面不存在或已被移除。</p>
            <a href="/">返回首页</a>
        </div>
    </div>
</body>

</html>
